installCertmanager: false

global:
  hosts:
    domain: 192.168.100.200.nip.io
    https: true
    externalIP: 192.168.100.200
    ssh: gitlab.192.168.100.201.nip.io
    # 2026-07-30：GitLab 公開曝露到 tashuchiu.online（Cloudflare Tunnel）之後，
    # 只換網頁登入這個子服務的 canonical hostname，registry/minio 仍沿用
    # domain 產生的內網網址，不受影響（見 webservice ingress.yaml 的
    # `global.hosts.gitlab.hostnameOverride | default (gitlab.gitlab.hostname)`
    # 這條 fallback 邏輯）。實測發現：這個值不只影響 Ingress 物件的 host，
    # 也連帶決定 GitLab 自己 Rails 端認定的 external_url——如果瀏覽器訪問的
    # 網址跟這裡設定的不一致，GitLab 前端會偵測到 canonical URL 不符，
    # 陷入 /users/sign_in 無限重新整理的迴圈（不是網路層問題，之前誤以為是
    # cookie/TLS 沒設好，兩者都要一起處理才會真的正常）。使用者決定只保留
    # 外部網址，原本的 .nip.io 內網登入之後不再保證能用。
    #
    # 2026-08-01 更正：上面「registry 不受影響」的假設是錯的。registry 元件
    # 本身的 hostname（registry.192.168.100.200.nip.io）確實沒變，但它的
    # JWT 認證 realm（container image pull 時用來跟 GitLab 換 token 的網址）
    # 預設是用 `gitlab.gitlab.hostname` 這個 helper 算出來的，讀的是
    # `global.hosts.gitlab.name`（沒設，所以退回 domain 組出來的舊內網網址），
    # 不是這裡的 hostnameOverride——兩個是完全不同的 helper（見
    # charts/registry/templates/_helpers.tpl 的 `registry.authEndpoint`
    # vs charts/gitlab/templates/_helpers.tpl 的 `gitlab.gitlab.hostname`）。
    # 內網登入關閉之後，這個舊網址整個 404，導致所有 pod image pull 認證失敗、
    # ImagePullBackOff（api pod 卡了 2 天才發現）。修法是用 registry 子圖表
    # 自己提供的 `authEndpoint` override（見下方 `registry:` 區塊），不要
    # 動 domain 或 hostnameOverride，registry 自己的 hostname 維持內網不變。
    gitlab:
      hostnameOverride: gitlab.tashuchiu.online
    # 2026-08-01 三度更正：前兩次分別用了 registry: hostname:（不存在的 key，
    # 對 registry 子圖表沒作用）跟後來才發現真正決定 registry Ingress host
    # 的是這裡——global.hosts.registry.name（見 charts/registry/templates/
    # _helpers.tpl 第 22 行：coalesce .Values.global.hosts.registry.name ...）。
    # 跟上面 gitlab.hostnameOverride 是同一層級的 global.hosts.<service> 命名
    # 慣例，只是 registry 子圖表用的是 `.name` 不是 `.hostnameOverride`。
    registry:
      name: registry.tashuchiu.online

  ingress:
    class: nginx
    configureCertmanager: false
    tls:
      enabled: true
      secretName: gitlab-wildcard-tls

  initialRootPassword:
    secret: gitlab-root-password
    key: password

  minio:
    enabled: true

  kas:
    enabled: false

# 停用 bundled nginx-ingress，使用我們自己的
nginx-ingress:
  enabled: false

# 停用 bundled prometheus，之後自己裝
prometheus:
  install: false

# GitLab Runner 之後單獨裝
gitlab-runner:
  install: false

# v9.x bundled services（v10.0 後移除）
redis:
  install: true

postgresql:
  install: true
  # 官方 chart 預設 250m，是給有實際多人並發連線量的場景設計的。實測（2026-07-29）
  # 這個 homelab 只有一人在用，過去 30 分鐘平均只用 28m，調到 100m 還留 3 倍以上安全
  # 邊際。這裡只有 requests（沒設 limits），調低不影響 GitLab 實際能拿到多少 CPU，
  # 只影響 k8s 排程器登記的保底值——三個節點目前 CPU request 帳面 83~97%、實際用量
  # 只有 34%，帳面超賣正是 add-distributed-tracing 排不進去的主因。
  primary:
    resources:
      requests:
        cpu: 100m

gitlab:
  gitlab-shell:
    service:
      type: LoadBalancer
  webservice:
    minReplicas: 1
    maxReplicas: 1
    # 2026-07-29：試過調低 CPU request（150m、250m 都試過），新 pod 開機時連續
    # 被 liveness probe 判定沒開機完就砍掉，還原回 chart 預設 300m。
    resources:
      requests:
        cpu: 300m
    # 2026-07-29 第二次調整：worker1 加 vCPU 後整台重開機，47 個 pod 同時冷啟動
    # （JVM 編譯、Longhorn 重建 replica…），node 陷入短暫的排隊風暴（load average
    # 一度到 30+），Rails preload 被拖慢到超過 chart 預設 liveness 容忍時間
    # （initialDelaySeconds 20 + failureThreshold 3 * periodSeconds 60 ≈ 170s），
    # 每次被砍掉都重置 preload 進度，形成打不完的 crash loop——跟 sidekiq 當初
    # 那次同一個模式（開機期間需要的時間 >> 穩態），只是這次觸發原因是 node
    # 級的搶資源风暴，不是把 CPU request 調低。只拉長 failureThreshold（不動
    # CPU request），維持跟 300m/100m 一致，不會再重演之前排程卡住的問題。
    # 2026-07-29 修正：webservice 這個 subchart 的 probe 路徑跟 sidekiq 不一樣，
    # 是巢狀在 deployment 底下（sidekiq 是扁平的 gitlab.sidekiq.livenessProbe），
    # 第一次套用時放錯路徑（gitlab.webservice.livenessProbe），helm 把它當成
    # 一個沒用到的多餘 key 合併進去，實際 Deployment 用的還是 chart 預設
    # failureThreshold 3，完全沒生效——同一時間風暴又持續加劇，變成 CrashLoopBackOff。
    deployment:
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 6
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    # 同上，還原回 chart 預設 900m
    resources:
      requests:
        cpu: 900m
    # sidekiq 的 chart 沒有支援 startupProbe（範本沒接這個機制，webservice 有但
    # 沒用，見上方說明保持一致），只能拉長 liveness probe 本身的容忍時間，原理
    # 跟 webservice 那段一樣
    livenessProbe:
      initialDelaySeconds: 90
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 5
  gitaly:
    # gitaly 是 StatefulSet，更新策略跟 webservice/sidekiq（Deployment，有
    # surge，會新舊世代同時存在搶資源）不同，是新舊一比一直接替換，不會有
    # 上面那種多世代搶資源的狀況。實測部署後全程穩定（0 restart），保留這個
    # 調降。chart 預設 100m，實測平均只用 ~9m，調到 50m 留 5 倍以上邊際
    resources:
      requests:
        cpu: 50m
  kas:
    enabled: false
  toolbox:
    backups:
      cron:
        enabled: false

registry:
  enabled: true
  # 見上方 global.hosts.gitlab 區塊 2026-08-01 註解：registry 的 JWT 認證
  # realm 不會跟著 hostnameOverride 走，要用這個 chart 自己的 authEndpoint
  # 明確覆蓋，否則預設會退回內網舊網址（現在已經 404）。只影響「跟 GitLab
  # 換 token」這個動作打去哪裡，跟 registry 本身的 hostname 無關。
  authEndpoint: https://gitlab.tashuchiu.online

# dummy email 讓 certmanager-issuer sub-chart 通過 schema 驗證
certmanager-issuer:
  email: admin@homelab.local
