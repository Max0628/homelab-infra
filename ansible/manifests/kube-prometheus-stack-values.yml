grafana:
  adminUser: admin
  # adminPassword 不進版控，安裝時用 --set 帶入

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    hosts:
      - grafana.192.168.100.200.nip.io
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.192.168.100.200.nip.io

  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: false

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # T480 host 本身跑在 hypervisor 層，不是 k8s 節點，ServiceMonitor 機制觸及不到，
    # 用 static_config 直接指向 host 的 node-exporter（見 install-node-exporter.yml，
    # 綁定在 virbr1 的 192.168.100.1，VM 內的 Prometheus 可直接連到）。
    additionalScrapeConfigs:
      - job_name: t480-host
        static_configs:
          - targets: ["192.168.100.1:9100"]

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    hosts:
      - prometheus.192.168.100.200.nip.io
    paths:
      - /
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.192.168.100.200.nip.io

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    hosts:
      - alertmanager.192.168.100.200.nip.io
    paths:
      - /
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.192.168.100.200.nip.io
