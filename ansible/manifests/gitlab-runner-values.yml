gitlabUrl: https://gitlab.tashuchiu.online

# runnerToken 不進版控，helm install/upgrade 時用 --set runnerToken=... 帶入

certsSecretName: homelab-ca-cert

# 2026-08-02：試過幫 Runner 管理用的常駐 pod 也加 hostAliases 導去內部路徑，
# 結果直接讓 Runner 完全掛掉——管理 pod 自己信任的憑證檔案是用舊網址命名的
# （homelab-ca-cert 裡的 key 是 gitlab.192.168.100.200.nip.io.crt，GitLab Runner
# 是照檔名對應網址找信任憑證的慣例），改連新網址後找不到對應的信任憑證，
# 直接 x509 unknown authority，管理 pod 卡在無限重試註冊、完全收不到 job。
# 撤回這項——這條沒有前面 job pod 那條（走 registry.tashuchiu.online 的部分）
# 用的是完全不同的信任機制，不能照搬同一招。要重新做的話，得先幫
# homelab-ca-cert 這個 Secret 補上 gitlab.tashuchiu.online.crt 這個 key
# （內容跟現有那把一樣），管理 pod 才認得。這次先不做，流量本來就小，優先
# 保證 Runner 能正常收 job。

runners:
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "alpine:latest"
        # 2026-08-02：CI job pod（git clone + 上傳產物/cache/job trace，還有 kaniko
        # push image 到 registry）原本會解析到 Cloudflare 的公開 IP，明明 Runner 跟
        # GitLab 在同一個叢集裡，卻要繞出去再繞回來——大檔案上傳/推送因此撞到
        # Cloudflare 免費版 100MB 限制，502 + 無窮重試（見 job-radar CI 排查紀錄）。
        # 這裡只在 job pod 自己的 /etc/hosts 加對應，導去叢集內部的
        # ingress-nginx-controller（Kubernetes hostAliases 只能填 IP，不能填 DNS 名稱，
        # 見下方 ip 欄位；這是該 Service 的 ClusterIP，只要沒重建這個 Service 就穩定）。
        # 不動 CoreDNS、不影響任何其他元件（尤其 ArgoCD——它也打
        # gitlab.tashuchiu.online，但走的是外部 Cloudflare 路徑，信任的是 Cloudflare
        # 自己的公開憑證，不是這裡的內部憑證，改全域 DNS 會連帶弄壞它，這裡刻意只在
        # Runner 自己的 job pod 範圍內做，見排查紀錄）。
        #
        # 2026-08-02 更正：下面這段憑證信任的說法原本是錯的——certsSecretName 只會把
        # CA 掛進「Runner 管理用的常駐 pod」，不會自動帶進這裡講的、每次任務動態產生
        # 的 job pod，這是 GitLab Runner 本身的已知限制（見 GitLab Issue #3715），
        # 目前沒有乾淨解法，job pod 內建 git checkout / artifact 上傳這兩步暫時還是
        # 無法信任這裡的內部憑證。kaniko push image 到 registry 不受影響——它是
        # .gitlab-ci.yml 裡明寫的 script，有自己一套獨立的憑證信任設定
        # （--registry-certificate 參數），不靠這個壞掉的機制。
        [[runners.kubernetes.host_aliases]]
          ip = "10.99.248.59"
          hostnames = ["gitlab.tashuchiu.online", "registry.tashuchiu.online"]
      # CI job pod 每次都是全新的（Kubernetes executor 沒有固定本機硬碟可以留快取），
      # 接上 GitLab 自帶的 MinIO（gitlab-minio，Helm chart 內建的一部分，不是另外新裝的）
      # 當快取後端，job 開始/結束時自動上傳/下載 .gitlab-ci.yml 裡 cache: 指定的資料夾。
      # runner-cache 這個 bucket 是 MinIO 原本就有的，不用另外建。
      [runners.cache]
        Type = "s3"
        Path = "gitlab-runner-cache"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "gitlab-minio-svc.gitlab.svc.cluster.local:9000"
          BucketName = "runner-cache"
          BucketLocation = "us-east-1"
          Insecure = true
  # 金鑰不寫在這個檔案裡（這個檔案會進 git）。secretName 指向的 Secret 是用
  # kubectl 另外建的，跟 GitLab 自己那組 gitlab-minio-secret 的 accesskey/secretkey
  # 是同一組值（這個 MinIO 的使用者/權限管理功能被鎖住，建不出限縮權限的專用帳號，
  # 只能先用管理員金鑰——已與使用者確認過這個取捨，見 job-radar CI 優化的討論）。
  cache:
    secretName: minio-cache-access
